name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The validate container's tag must match the locked @playwright/test, and
  # `container.image` can only read `needs` outputs, so resolve it first.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - id: resolve
        run: |
          version="$(grep -m1 -oP "^  '@playwright/test@\K[0-9.]+" pnpm-lock.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled, so no step
    # depends on an apt mirror.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      # pnpm version resolves from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Format check + typecheck + lint + unit tests + e2e. The e2e run
      # downloads the pinned PocketBase, starts it on a throwaway data
      # directory and seeds it (playwright.config.ts, .dev.vars.e2e).
      - run: pnpm validate

      # validate doesn't build; catch build-only regressions here.
      - run: pnpm build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Syncs pocketbase/pb_migrations to the PocketHost instance. PocketHost
  # restarts the instance to apply new migrations. Runs only for pushes
  # to main (which includes PR merges), and only once validate has passed.
  deploy-pocketbase:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, in push order; never cancel a sync halfway.
    concurrency:
      group: deploy-pocketbase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Nothing is installed from the lockfile: the script runs a pinned
      # PocketHost CLI through npx. setup-node would otherwise see the
      # packageManager field and try to cache with pnpm, which this job
      # never installs.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Deploy to PocketHost
        env:
          POCKETHOST_TOKEN: ${{ secrets.POCKETHOST_TOKEN }}
        run: |
          if [ -z "$POCKETHOST_TOKEN" ]; then
            echo "::error::Missing repository secret POCKETHOST_TOKEN (see Deploy in README.md)"
            exit 1
          fi
          bash scripts/pocketbase-deploy.sh --commit "$GITHUB_SHA"

  # Builds and deploys the Worker (API + static assets) to Cloudflare, routed
  # to irl.page. Runs after the database deploy so new code never meets an
  # old schema. The Worker's runtime secrets are set once with
  # `wrangler secret put` and survive deploys (see "Deploy" in README.md).
  deploy-worker:
    needs: [validate, deploy-pocketbase]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, in push order.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see Deploy in README.md)"
              exit 1
            fi
          done
          pnpm exec wrangler deploy

  # No PR-preview job yet.
